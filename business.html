<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업영역 | THE RUSS</title>
<meta name="description" content="THE RUSS(더루스)의 사업영역: 한-러 무역·비즈니스 중개, 스포츠 에이전시, 수산물 유통, 통번역·헤드헌팅, 콘텐츠·마케팅.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23151515%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Arial Black,sans-serif%22 fill=%22white%22 text-anchor=%22middle%22 font-weight=%22900%22>R</text></svg>">
<style>
:root{
  --navy:#151515;
  --navy-dark:#000000;
  --navy-light:#3b3b3b;
  --ink:#161a22;
  --gray-700:#4a5062;
  --gray-500:#767c8c;
  --gray-300:#d7dae2;
  --gray-100:#f3f5f8;
  --white:#ffffff;
  --accent:#c9a24a;
  --radius:14px;
  --maxw:1180px;
  --shadow:0 10px 30px rgba(0,0,0,0.16);
  --shadow-sm:0 4px 14px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
  background:var(--white);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
section{padding:120px 0;}
@media (max-width:720px){ section{padding:72px 0;} }

/* ---------- Header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--gray-300);
  transition:box-shadow .2s ease;
}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:26px;width:auto;}
nav.mainnav{display:flex;gap:6px;align-items:center;}
nav.mainnav a{
  padding:10px 14px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--gray-700);
  transition:background .15s ease,color .15s ease;
  white-space:nowrap;
}
nav.mainnav a:hover{background:var(--gray-100);color:var(--navy);}
nav.mainnav a.active{background:var(--navy);color:#fff;}
.lang-switch{display:flex;gap:2px;background:var(--gray-100);border-radius:999px;padding:3px;margin-left:8px;}
.lang-switch button{
  border:none;background:transparent;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;
  color:var(--gray-500);cursor:pointer;letter-spacing:.02em;
}
.lang-switch button.active{background:var(--navy);color:#fff;}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;}
.nav-toggle span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px;}
@media (max-width:920px){
  nav.mainnav.links{position:fixed;top:76px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;
    padding:12px 20px 20px;border-bottom:1px solid var(--gray-300);display:none;gap:2px;}
  nav.mainnav.links.open{display:flex;}
  nav.mainnav.links a{padding:12px 10px;}
  .nav-toggle{display:block;}
  .lang-switch{margin-left:auto;}
}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;
  cursor:pointer;border:1.5px solid transparent;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow);}
.btn-primary:hover{background:var(--navy-dark);}
.btn-outline{border-color:var(--gray-300);color:var(--ink);background:#fff;}
.btn-outline:hover{border-color:var(--navy);color:var(--navy);}

/* ---------- Section heading ---------- */
.section-tag{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--navy);text-transform:uppercase;margin-bottom:16px;}
.section-title{font-size:clamp(28px,4.4vw,48px);font-weight:900;letter-spacing:-0.015em;margin:0 0 18px;}
.section-desc{color:var(--gray-700);font-size:16px;max-width:640px;margin:0 0 56px;}
.section-head{margin-bottom:8px;}

/* ---------- Page hero (subpages) ---------- */
.page-hero{padding:200px 0 80px;background:var(--gray-100);}
.page-hero-eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:20px;}
.page-hero h1{font-size:clamp(32px,5.6vw,64px);font-weight:900;letter-spacing:-0.02em;line-height:1.1;margin:0 0 22px;white-space:pre-line;}
.page-hero p{font-size:clamp(15.5px,1.8vw,18px);color:var(--gray-700);max-width:680px;margin:0;}
.page-hero-dark{background:var(--navy-dark);color:#fff;}
.page-hero-dark p{color:rgba(255,255,255,0.75);}
@media (max-width:720px){ .page-hero{padding:150px 0 56px;} }

/* ---------- Footer ---------- */
footer{background:var(--navy-dark);color:rgba(255,255,255,0.65);padding:52px 0 30px;font-size:12.8px;}
footer .wrap{display:flex;flex-direction:column;gap:14px;}
footer .foot-brand{color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;}
footer .foot-nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0;}
footer .foot-nav a{color:rgba(255,255,255,0.7);font-size:12.8px;font-weight:600;}
footer .foot-nav a:hover{color:#fff;}
footer .foot-line{line-height:1.9;}
footer .foot-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in{opacity:1;transform:translateY(0);}


#areas{background:#fff;}
.area-groups{display:flex;flex-direction:column;gap:56px;}
.area-group-label{font-size:14px;font-weight:800;color:var(--navy-dark);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.area-group-label::after{content:"";flex:1;height:1px;background:var(--gray-300);}
.area-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
@media (max-width:1040px){ .area-cards{grid-template-columns:repeat(2,1fr) !important;} }
@media (max-width:560px){ .area-cards{grid-template-columns:1fr !important;} }
.area-group-primary .area-group-label{color:var(--accent);font-size:15px;}
.area-cards-primary{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:1040px){ .area-cards-primary{grid-template-columns:repeat(2,1fr) !important;} }
@media (max-width:560px){ .area-cards-primary{grid-template-columns:1fr !important;} }
.area-card-primary{
  background:linear-gradient(160deg,var(--navy) 0%, var(--navy-dark) 100%);
  color:#fff;border-radius:var(--radius);padding:30px 24px;border:1px solid rgba(0,0,0,0.4);
  transition:box-shadow .2s ease,transform .2s ease;position:relative;overflow:hidden;
}
.area-card-primary::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
.area-card-primary:hover{box-shadow:0 14px 32px rgba(0,0,0,0.28);transform:translateY(-3px);}
.area-icon{font-size:28px;margin-bottom:16px;display:block;}
.area-name{font-weight:800;font-size:16.5px;margin-bottom:9px;}
.area-desc{color:rgba(255,255,255,0.78);font-size:13.6px;}
.area-card-primary a.area-card-link{display:block;color:inherit;}
.area-card-primary a.area-card-link .area-more{margin-top:12px;font-size:12.5px;font-weight:800;color:var(--accent);}

.area-feature{background:var(--gray-100);border:1px solid var(--gray-300);color:var(--ink);border-radius:var(--radius);padding:30px 32px;}
.area-feature-icon{font-size:26px;margin-bottom:12px;display:block;}
.area-feature-name{font-size:clamp(17px,2vw,19px);font-weight:800;margin-bottom:10px;}
.area-feature-desc{font-size:14px;line-height:1.7;color:var(--gray-700);max-width:760px;margin-bottom:18px;}
.area-feature-tags{display:flex;flex-wrap:wrap;gap:9px;}
.area-feature-tag{background:#fff;color:var(--gray-700);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;}
@media (max-width:720px){ .area-feature{padding:24px 22px;} }
</style>
</head>

let currentLang = "ko";

function t(path, lang){
  const parts = path.split(".");
  let obj = DATA[lang];
  for(const p of parts){ if(obj==null) return ""; obj = obj[p]; }
  return obj==null ? "" : obj;
}

function renderStaticText(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    const val = t(key, lang);
    if(val) el.textContent = val;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const key = el.getAttribute("data-i18n-html");
    const val = t(key, lang);
    if(val) el.innerHTML = val;
  });
}

function getInitialLang(){
  try{
    const saved = localStorage.getItem("the-russ-lang");
    if(saved === "ko" || saved === "en" || saved === "ru") return saved;
  }catch(e){}
  return "ko";
}

function syncLangUI(lang){
  try{ localStorage.setItem("the-russ-lang", lang); }catch(e){}
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-lang")===lang);
  });
  const navLinks = document.getElementById("navLinks");
  if(navLinks) navLinks.classList.remove("open");
  const here = (location.pathname.split("/").pop() || "index.html");
  document.querySelectorAll("#navLinks a[data-nav]").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-nav")===here);
  });
}

document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.addEventListener("click", ()=> setLang(b.getAttribute("data-lang")));
});
const navToggleBtn = document.getElementById("navToggle");
if(navToggleBtn){
  navToggleBtn.addEventListener("click", ()=>{
    document.getElementById("navLinks").classList.toggle("open");
  });
}
document.querySelectorAll("#navLinks a:not(.lang-switch button)").forEach(a=>{
  a.addEventListener("click", ()=>{ const nl=document.getElementById("navLinks"); if(nl) nl.classList.remove("open"); });
});

function initReveal(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  },{threshold:0.1});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}

  window.addEventListener("scroll", ()=>{
    const header = document.querySelector("header");
    if(!header) return;
    if(window.scrollY > 10){ header.style.boxShadow = "0 2px 16px rgba(0,0,0,0.16)"; }
    else{ header.style.boxShadow = "none"; }
  });
}


function renderAreas(lang){
  const d = DATA[lang];
  const container = document.getElementById("areaGroups");
  const f = d.contentFeature;
  container.innerHTML = `
    <div class="area-group-primary">
      <div class="area-group-label">${d.groupBiz}</div>
      <div class="area-cards-primary reveal in">${d.bizAreas.map(a=>{
        const inner = `<span class="area-icon">${a.icon}</span><div class="area-name">${a.name}</div><div class="area-desc">${a.desc}</div>`;
        return `<div class="area-card-primary"><a class="area-card-link" href="${a.href}">${inner}<div class="area-more">${d.linkMore}</div></a></div>`;
      }).join("")}</div>
    </div>
    <div>
      <div class="area-group-label">${d.groupContent}</div>
      <div class="area-feature reveal in">
        <span class="area-feature-icon">${f.icon}</span>
        <div class="area-feature-name">${f.name}</div>
        <div class="area-feature-desc">${f.desc}</div>
        <div class="area-feature-tags">${f.tags.map(t=>`<span class="area-feature-tag">${t}</span>`).join("")}</div>
      </div>
    </div>`;
}

function setLang(lang){
  currentLang = lang;
  renderStaticText(lang);
  renderAreas(lang);
  syncLangUI(lang);
}
setLang(getInitialLang());
initReveal();
initHeaderShadow();
</script>
</body>
</html>
