<title>인적자원 네트워크 | THE RUSS</title>
<meta name="description" content="THE RUSS가 보유한 한-러 통번역·헤드헌팅 인적자원 네트워크를 카테고리별로 소개합니다.">

<style>
:root{
  --navy:#151515; --navy-dark:#000000; --navy-light:#3b3b3b;
  --ink:#161a22; --gray-700:#4a5062; --gray-500:#767c8c; --gray-300:#d7dae2; --gray-100:#f3f5f8; --white:#fff;
  --accent:#c9a24a; --radius:14px; --maxw:1180px; --shadow:0 10px 30px rgba(0,0,0,0.16);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:"Pretendard","Noto Sans KR","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--gray-300);}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:26px;width:auto;}
.back-link{font-size:14.5px;font-weight:700;color:var(--gray-700);padding:10px 14px;border-radius:999px;}
.back-link:hover{background:var(--gray-100);color:var(--navy);}
.lang-switch{display:flex;gap:2px;background:var(--gray-100);border-radius:999px;padding:3px;margin-left:8px;}
.lang-switch button{border:none;background:transparent;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--gray-500);cursor:pointer;}
.lang-switch button.active{background:var(--navy);color:#fff;}
.hero-t{padding:150px 0 60px;background:linear-gradient(180deg,#fff 0%, #f6f6f6 100%);}
.section-tag{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--navy);text-transform:uppercase;margin-bottom:14px;}
.hero-t h1{font-size:clamp(26px,4vw,42px);font-weight:800;margin:0 0 18px;letter-spacing:-0.01em;}
.hero-t p{color:var(--gray-700);font-size:16px;max-width:680px;margin:0;}
main{padding:64px 0 100px;}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-bottom:56px;}
@media (max-width:800px){ .cat-grid{grid-template-columns:1fr;} }
.cat-card{border:1px solid var(--gray-300);border-radius:var(--radius);padding:30px 28px;background:#fff;position:relative;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease;}
.cat-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);}
.cat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
.cat-icon{font-size:28px;margin-bottom:14px;display:block;}
.cat-name{font-weight:800;font-size:18px;margin-bottom:10px;}
.cat-desc{font-size:14px;color:var(--gray-700);}
.cta-box{background:linear-gradient(160deg,var(--navy) 0%, var(--navy-dark) 100%);color:#fff;border-radius:var(--radius);padding:40px 44px;text-align:center;}
.cta-box h3{margin:0 0 12px;font-size:20px;font-weight:800;}
.cta-box p{margin:0 0 24px;opacity:.85;font-size:14.5px;max-width:560px;margin-left:auto;margin-right:auto;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#151515;}
footer{background:var(--navy-dark);color:rgba(255,255,255,0.65);padding:36px 0;font-size:12.8px;text-align:center;}
</style>
</head>

function render(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(T[lang][key]) el.textContent = T[lang][key];
  });
  document.getElementById("catGrid").innerHTML = T[lang].cats.map(c=>`
    <div class="cat-card">
      <span class="cat-icon">${c.icon}</span>
      <div class="cat-name">${c.name}</div>
      <div class="cat-desc">${c.desc}</div>
    </div>`).join("");
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-lang")===lang);
  });
}
document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.addEventListener("click", ()=> render(b.getAttribute("data-lang")));
});
